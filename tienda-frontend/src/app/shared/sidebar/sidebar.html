@if (dashboardUi.sidebarAbierto()) {
  <div class="sidebar-overlay" (click)="dashboardUi.cerrarSidebar()"></div>
}

<aside class="sidebar" [class.abierto]="dashboardUi.sidebarAbierto()">
  <div class="sidebar-brand">SOLEX <span>Admin</span></div>

  <nav>
    <ul>
      <li><a routerLink="/dashboard/inicio" routerLinkActive="active" (click)="dashboardUi.cerrarSidebar()">Inicio</a></li>
      <li><a routerLink="/dashboard/productos" routerLinkActive="active" (click)="dashboardUi.cerrarSidebar()">Productos</a></li>
      <li><a routerLink="/dashboard/categorias" routerLinkActive="active" (click)="dashboardUi.cerrarSidebar()">Categorías</a></li>
      <li><a routerLink="/dashboard/ventas" routerLinkActive="active" (click)="dashboardUi.cerrarSidebar()">Ventas</a></li>
      <li><a routerLink="/dashboard/clientes" routerLinkActive="active" (click)="dashboardUi.cerrarSidebar()">Clientes</a></li>
    </ul>
  </nav>

  <a routerLink="/" class="sidebar-volver">← Volver a la tienda</a>
</aside>
