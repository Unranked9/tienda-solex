<div class="admin-page">
  <div class="admin-page-header">
    <h2>Productos</h2>
    <a routerLink="/dashboard/productos/nuevo" class="btn-primary">+ Nuevo Producto</a>
  </div>

  <div class="admin-table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Imagen</th>
          <th>Nombre</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of productos">
          <td><img class="row-thumb" [src]="p.imagenUrl ? fileBaseUrl + p.imagenUrl : placeholderImg" (error)="onImgError($event)" /></td>
          <td>{{ p.nombre }}</td>
          <td>{{ p.categoriaNombre }}</td>
          <td>S/ {{ p.precio }}</td>
          <td>{{ p.stock }}</td>
          <td>
            <span class="badge-estado" [class.badge-ok]="p.activo" [class.badge-cancelado]="!p.activo">
              {{ p.activo ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <td class="acciones">
            <a class="btn-link" [routerLink]="['/dashboard/productos/editar', p.id]">Editar</a>
            <button class="btn-danger" (click)="eliminar(p.id!)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
