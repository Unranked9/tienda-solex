spring.application.name=tienda-backend

# ===== Base de datos =====
# IMPORTANTE: la base de datos y sus tablas se crean manualmente
# ejecutando el script tienda_virtual3.sql en MySQL Workbench ANTES
# de arrancar el backend (mismo criterio que usa el profesor con
# tienda_dev.sql). Hibernate NO crea ni modifica el esquema.
# Los valores por defecto (localhost/root/root) se usan en desarrollo local.
# En producción (Railway/Render) se sobreescriben con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_virtual3?useSSL=false&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# validate: Hibernate solo verifica que las tablas coincidan con las
# entidades; si la tabla no existe, la app falla al iniciar en vez de
# crearla silenciosamente. Ejecuta primero tienda_virtual3.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Servidor =====
# Railway/Render inyectan la variable PORT en tiempo de ejecución.
server.port=${PORT:8080}

# ===== JWT =====
# Clave secreta (cambiar en producción, minimo 256 bits para HS256)
jwt.secret=${JWT_SECRET:c2VjcmV0b011eVNlZ3Vyb1BhcmFGaXJtYXJKV1RUaWVuZGFWaXJ0dWFsMjAyNQ==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Archivos / imagenes de productos =====
file.upload-dir=uploads/productos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===== CORS =====
# En producción, definir CORS_ALLOWED_ORIGINS con la URL real del frontend
# desplegado (ej: https://tienda-solex.vercel.app). Se pueden separar
# varios orígenes con comas.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
